name: LinkedIn Blog Post

on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: "Full URL of the published blog post"
        required: true
        type: string
      post_text:
        description: "LinkedIn post text"
        required: true
        type: string

permissions:
  contents: read

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Publish blog link to personal LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: HdCDojxoM7
          BLOG_URL: ${{ inputs.blog_url }}
          POST_TEXT: ${{ inputs.post_text }}
        run: |
          node <<'NODE'
          const token = process.env.LINKEDIN_ACCESS_TOKEN;
          const memberId = process.env.LINKEDIN_MEMBER_ID;
          const blogUrl = process.env.BLOG_URL;
          const postText = process.env.POST_TEXT;

          if (!token || !memberId || !blogUrl || !postText) {
            throw new Error("A required input or secret is missing.");
          }

          const url = new URL(blogUrl);
          if (url.protocol !== "https:" || url.hostname !== "www.anshidck.com") {
            throw new Error("Enter a published HTTPS blog URL on www.anshidck.com.");
          }

          async function main() {
            const response = await fetch("https://api.linkedin.com/rest/posts", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                "LinkedIn-Version": "202610",
                "X-Restli-Protocol-Version": "2.0.0"
              },
              body: JSON.stringify({
                author: `urn:li:person:${memberId}`,
                commentary: `${postText}\n\nRead the full article: ${blogUrl}`,
                visibility: "PUBLIC",
                distribution: {
                  feedDistribution: "MAIN_FEED",
                  targetEntities: [],
                  thirdPartyDistributionChannels: []
                },
                lifecycleState: "PUBLISHED",
                isReshareDisabledByAuthor: false
              })
            });

            if (!response.ok) {
              const details = await response.text();
              throw new Error(`LinkedIn API returned ${response.status}: ${details}`);
            }

            console.log("LinkedIn post published successfully.");
            console.log("LinkedIn post ID:", response.headers.get("x-restli-id") || "Created");
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
